<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta http-equiv="refresh" content="0; url=https://central.po-control.com.br/" />
<title>Controle de PO — mudou de endereço</title>
<style>
  :root{ --ink:#10131a; --muted:#6b6f76; --line:#e3e4e8; --accent:#2b4fdd; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f1f2f4;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:24px}
  .card{max-width:420px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:32px 28px;text-align:center;box-shadow:0 1px 2px rgba(20,22,28,.05),0 8px 24px -12px rgba(20,22,28,.12)}
  h1{font-size:18px;margin:0 0 8px;letter-spacing:-.01em}
  p{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  a.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;
    background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:13.5px}
  .redirecting{font-size:11.5px;color:var(--muted);margin-top:16px}
</style>
<script>
  var dest = 'https://central.po-control.com.br/' + location.search + location.hash;
  location.replace(dest);
</script>
</head>
<body>
  <div class="card">
    <h1>Este link mudou</h1>
    <p>O Controle de PO agora faz parte da TCL Platform, em um novo endereço.</p>
    <a class="btn" id="go" href="https://central.po-control.com.br/">Ir para central.po-control.com.br →</a>
    <div class="redirecting">Redirecionando automaticamente…</div>
  </div>
  <script>
    document.getElementById('go').href = 'https://central.po-control.com.br/' + location.search + location.hash;
  </script>
</body>
</html>
